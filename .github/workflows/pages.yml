name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "matrix=$(jq -c . imgui-versions.json)" >> "$GITHUB_OUTPUT"

  # One build per entry in imgui-versions.json. Each is cached by the exact jsimgui commit,
  # so a version only recompiles when its branch moves (or the build recipe changes).
  build:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - id: rev
        run: echo "sha=$(git ls-remote https://github.com/${{ matrix.version.repo }}.git ${{ matrix.version.ref }} | cut -f1 | head -1)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: jsimgui-${{ steps.rev.outputs.sha }}-emsdk-${{ matrix.version.emsdk }}-node-${{ matrix.version.node }}-${{ hashFiles('scripts/build-jsimgui.sh') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: git clone --recursive --depth 1 --shallow-submodules --branch ${{ matrix.version.ref }} https://github.com/${{ matrix.version.repo }}.git jsimgui
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.version.emsdk }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version.node }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-jsimgui.sh jsimgui out

      - uses: actions/upload-artifact@v4
        with:
          name: imgui-${{ matrix.version.id }}
          path: out

  deploy:
    needs: build
    # Deploy whatever built; the page falls back to the npm jsimgui release if nothing did.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
          pattern: imgui-*

      - name: Assemble site
        run: |
          mkdir -p _site/lib
          cp -r index.html app.js assets.js CNAME samples _site/
          # Caches in front of Pages (Cloudflare: 4h) would otherwise serve old scripts after a
          # deploy, so every deploy gets new script URLs and every library build its own folder.
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/g" _site/index.html
          echo '[]' > versions.json
          for id in $(jq -r '.[].id' imgui-versions.json); do
            if [ -f "built/imgui-$id/mod.js" ]; then
              rev=$(jq -r .jsimgui "built/imgui-$id/build-info.json")
              mkdir -p "_site/lib/$id"
              cp -r "built/imgui-$id" "_site/lib/$id/$rev"
              jq --arg id "$id" --arg path "lib/$id/$rev/" '. + [{id: $id, path: $path}]' versions.json > versions.tmp
              mv versions.tmp versions.json
            else
              echo "::warning::imgui $id did not build; leaving it out"
            fi
          done
          # Newest first; the page defaults to the first entry.
          jq 'sort_by(.id | split(".") | map(tonumber)) | reverse' versions.json > _site/lib/versions.json
          cat _site/lib/versions.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
